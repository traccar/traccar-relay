name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../environment
          echo "$KEYSTORE_BASE64" | base64 -d > ../environment/android.keystore

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ../environment/key.properties

      - name: Build release artifacts
        run: ./gradlew :app:assembleRelease

      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/traccar-relay-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: relay-apk
          path: app/build/outputs/apk/release/traccar-relay-release.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v8
        with:
          name: relay-apk
          path: .

      - name: Launch emulator and verify app starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r traccar-relay-release.apk
            adb shell monkey -p org.traccar.relay -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png launch.png
            adb shell pidof org.traccar.relay > /dev/null || { echo "App process not running after launch — crashed."; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: launch-screenshot
          path: launch.png
          if-no-files-found: error

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: relay-apk
          path: relay-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: relay-apk/traccar-relay-release.apk
